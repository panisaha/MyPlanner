<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyPlanner - Timer</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .timer-container {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 40px 20px;
            text-align: center;
            border: 1px solid var(--border-color);
            max-width: 400px;
            margin: 0 auto;
            transition: all 0.5s ease;
        }
        
        /* کلاس برای حالت استراحت (سبز) */
        .timer-container.break-mode {
            border-color: #4caf50;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.2);
        }
        .timer-container.break-mode .timer-title,
        .timer-container.break-mode .timer-display {
            color: #4caf50;
            text-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .timer-title {
            color: var(--accent);
            font-size: 1.2rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase;
            transition: color 0.3s;
        }
        .timer-display {
            font-size: 5rem;
            font-weight: bold;
            color: var(--text-color);
            margin-bottom: 30px;
            font-family: 'Courier New', Courier, monospace;
            text-shadow: 0 0 20px rgba(92, 14, 27, 0.5);
            transition: color 0.3s;
        }
        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .timer-controls button {
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 12px;
        }
        .timer-controls button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* تنظیمات زمان */
        .time-settings {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        .time-settings .setting {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .time-settings label {
            font-size: 0.9rem;
            margin-bottom: 5px;
            color: #aaa;
        }
        .time-settings input {
            width: 60px;
            padding: 8px;
            text-align: center;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            color: var(--text-color);
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="navbar">
            <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Home</a>
            <a href="notes.html" class="nav-btn"><i class="fas fa-book-open"></i> Notes</a>
            <a href="tasks.html" class="nav-btn"><i class="fas fa-tasks"></i> Tasks</a>
            <a href="timer.html" class="nav-btn active"><i class="fas fa-clock"></i> Timer</a>
            <a href="links.html" class="nav-btn"><i class="fas fa-link"></i> Links</a>
            <a href="alarm.html" class="nav-btn"><i class="fas fa-bell"></i> Alarm</a>
            <a href="support.html" class="nav-btn"><i class="fas fa-headset"></i> Support</a>
        </div>

        <div class="timer-container" id="timerContainer">
            <div class="timer-title" id="timerTitle">Focus Time</div>
            <div class="timer-display" id="timerDisplay">25:00</div>
            
            <div class="timer-controls">
                <button id="startBtn" onclick="startTimer()"><i class="fas fa-play"></i> Start</button>
                <button id="pauseBtn" onclick="pauseTimer()" disabled><i class="fas fa-pause"></i> Pause</button>
                <button id="resetBtn" onclick="resetTimer()"><i class="fas fa-undo"></i> Reset</button>
            </div>

            <!-- تنظیم زمان کار و استراحت -->
            <div class="time-settings">
                <div class="setting">
                    <label>Focus (min)</label>
                    <input type="number" id="focusInput" value="25" min="1" max="120">
                </div>
                <div class="setting">
                    <label>Break (min)</label>
                    <input type="number" id="breakInput" value="5" min="1" max="60">
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>

    <script>
        // ================== منطق تایمر حرفه‌ای ==================
        let timer;
        let isRunning = false;
        let isBreak = false; // آیا در حال استراحت هستیم؟
        
        let focusTime = 25 * 60;
        let breakTime = 5 * 60;
        let timeLeft = focusTime;

        const display = document.getElementById('timerDisplay');
        const title = document.getElementById('timerTitle');
        const container = document.getElementById('timerContainer');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const focusInput = document.getElementById('focusInput');
        const breakInput = document.getElementById('breakInput');

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            display.innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function startTimer() {
            if (isRunning) return;
            
            // خواندن زمان‌های جدید از ورودی‌ها (فقط اگر تایمر متوقف باشد)
            if (!isRunning && timeLeft === (isBreak ? breakTime : focusTime)) {
                focusTime = parseInt(focusInput.value) * 60 || 25 * 60;
                breakTime = parseInt(breakInput.value) * 60 || 5 * 60;
                timeLeft = isBreak ? breakTime : focusTime;
                updateDisplay();
            }

            isRunning = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            focusInput.disabled = true;
            breakInput.disabled = true;

            timer = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateDisplay();
                } else {
                    // زمان تمام شد
                    clearInterval(timer);
                    isRunning = false;
                    
                    if (!isBreak) {
                        // برو به حالت استراحت
                        isBreak = true;
                        timeLeft = breakTime;
                        title.innerText = "Break Time";
                        container.classList.add('break-mode');
                        alert("Focus time is over! Time for a break.");
                    } else {
                        // برگرد به حالت کار
                        isBreak = false;
                        timeLeft = focusTime;
                        title.innerText = "Focus Time";
                        container.classList.remove('break-mode');
                        alert("Break is over! Let's get back to work.");
                    }
                    
                    updateDisplay();
                    startBtn.disabled = false;
                    pauseBtn.disabled = true;
                    focusInput.disabled = false;
                    breakInput.disabled = false;
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timer);
            isRunning = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            focusInput.disabled = false;
            breakInput.disabled = false;
        }

        function resetTimer() {
            clearInterval(timer);
            isRunning = false;
            isBreak = false;
            focusTime = parseInt(focusInput.value) * 60 || 25 * 60;
            breakTime = parseInt(breakInput.value) * 60 || 5 * 60;
            timeLeft = focusTime;
            title.innerText = "Focus Time";
            container.classList.remove('break-mode');
            updateDisplay();
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            focusInput.disabled = false;
            breakInput.disabled = false;
        }

        // رندر اولیه
        updateDisplay();
    </script>
    <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MyPlanner - Support</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* استایل شیشه‌ای و خوشگل برای فرم پشتیبانی */
        .support-container {
            background: rgba(30, 0, 0, 0.4); /* پس‌زمینه شیشه‌ای تیره */
            backdrop-filter: blur(12px); /* افکت بلور */
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 40px 30px;
            border: 1px solid rgba(139, 0, 0, 0.3); /* حاشیه زرشکی */
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8); /* سایه عمیق */
            max-width: 500px;
            margin: 0 auto;
        }
        
        .support-container h2 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .support-container p {
            text-align: center;
            color: #ccc;
            margin-bottom: 30px;
            font-size: 1rem;
            line-height: 1.5;
        }
        
        .support-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .support-form input, 
        .support-form textarea {
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(139, 0, 0, 0.3);
            background: rgba(0, 0, 0, 0.5); /* ورودی‌های تیره و شفاف */
            color: var(--text-color);
            outline: none;
            font-family: inherit;
            font-size: 1rem;
            transition: 0.3s;
        }
        .support-form input:focus, 
        .support-form textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.5);
        }
        .support-form textarea {
            resize: none;
            height: 150px;
        }
        
        .support-form button {
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="navbar">
            <a href="index.html" class="nav-btn"><i class="fas fa-home"></i> Home</a>
            <a href="notes.html" class="nav-btn"><i class="fas fa-book-open"></i> Notes</a>
            <a href="tasks.html" class="nav-btn"><i class="fas fa-tasks"></i> Tasks</a>
            <a href="timer.html" class="nav-btn"><i class="fas fa-clock"></i> Timer</a>
            <a href="links.html" class="nav-btn"><i class="fas fa-link"></i> Links</a>
            <a href="alarm.html" class="nav-btn"><i class="fas fa-bell"></i> Alarm</a>
            <a href="support.html" class="nav-btn active"><i class="fas fa-headset"></i> Support</a>
        </div>

        <div class="support-container">
            <h2>Contact Support</h2>
            <p>Have a question, suggestion, or found a bug? Drop a message below and it will be sent directly to me!</p>
            
            <!-- فرم تماس (به Formspree وصل شده) -->
            <form class="support-form" action="https://formspree.io/f/mgaaqgnz" method="POST">
                <input type="text" name="name" placeholder="Your Name" required>
                <input type="email" name="email" placeholder="Your Email" required>
                <textarea name="message" placeholder="What would you like to tell me?" required></textarea>
                <button type="submit"><i class="fas fa-paper-plane"></i> Send Message</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
